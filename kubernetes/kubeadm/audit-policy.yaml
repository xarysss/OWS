# Politique d'audit de l'API (copiée dans /etc/kubernetes/ sur chaque control plane).
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages:
  - RequestReceived
rules:
  # Jamais le contenu des Secrets ni des ConfigMaps
  - level: Metadata
    resources:
      - group: ""
        resources: ["secrets", "configmaps"]
  - level: None
    users: ["system:kube-proxy"]
    verbs: ["watch"]
  - level: None
    nonResourceURLs: ["/healthz*", "/livez*", "/readyz*", "/version"]
  - level: Request
    verbs: ["create", "update", "patch", "delete"]
  - level: Metadata
