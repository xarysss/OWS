---
# Kolla-Ansible tout-en-un sur os-compute-6 (Rocky 10, OpenStack 2026.2). Aucun secret ici.
workaround_ansible_issue_8743: yes
kolla_base_distro: "rocky"
openstack_release: "2026.2"
kolla_container_engine: "podman"

# Réseau : management sur la carte 10 Gb, réseau externe sur la carte 1 Gb sans IP.
network_interface: "ens1f0np0"
neutron_external_interface: "eno1"
neutron_plugin_agent: "ovn"
enable_neutron_provider_networks: "yes"

# Un seul nœud : pas de HAProxy/keepalived (aucun conflit VRRP avec le cloud voisin),
# l'API répond directement sur l'IP du serveur.
kolla_internal_vip_address: "10.202.100.36"
enable_haproxy: "no"
enable_proxysql: "no"

nova_compute_virt_type: "kvm"

# Volumes : LVM sur /dev/sda (groupe cinder-volumes).
enable_cinder: "yes"
enable_cinder_backend_lvm: "yes"
enable_cinder_backup: "no"
cinder_volume_group: "cinder-volumes"

# Images publiques quay.io/openstack.kolla : prévues pour les tests, acceptées pour cette SAE.
kolla_test_images: "yes"

# La cible iSCSI (lioadm) a besoin de configfs dans le conteneur cinder_volume.
cinder_volume_extra_volumes:
  - "/sys/kernel/config:/sys/kernel/config"
