# ArgoCD (chart argo/argo-cd). Installé par scripts/deploy-cluster.sh argocd,
# puis géré par lui-même (gitops/apps/argocd.yaml).
global:
  domain: argocd.ows.local

configs:
  params:
    server.insecure: true          # TLS terminé au niveau du LB / à ajouter avec cert-manager
  cm:
    timeout.reconciliation: 120s
    # Indispensable pour que les vagues (sync-wave) de l'app-of-apps attendent
    # qu'une Application soit saine avant de passer à la suivante.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
    # Évite les faux "OutOfSync" sur les CRD et champs gérés par des opérateurs.
    resource.exclusions: |
      - apiGroups: ["cilium.io"]
        kinds: ["CiliumIdentity"]
        clusters: ["*"]
  rbac:
    policy.default: role:readonly
    policy.csv: |
      g, ows-admins, role:admin
  repositories:
    ows:
      url: https://github.com/xarysss/OWS.git
      type: git
      name: ows

controller:
  replicas: 1
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false   # réactivé par l'Application argocd une fois les CRD présentes

server:
  replicas: 2
  service:
    type: LoadBalancer
    annotations:
      metallb.universe.tf/loadBalancerIPs: 10.20.0.201
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

repoServer:
  replicas: 2
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

applicationSet:
  replicas: 1

redis-ha:
  enabled: false

dex:
  enabled: false

notifications:
  enabled: false
