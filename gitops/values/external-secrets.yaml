# External Secrets Operator (chart external-secrets/external-secrets).
# Lit Vault (auth Kubernetes) et crée les Secrets Kubernetes : aucun secret dans Git.
installCRDs: true
replicaCount: 1
serviceMonitor:
  enabled: true
webhook:
  replicaCount: 1
certController:
  replicaCount: 1
resources:
  requests: { cpu: 50m, memory: 64Mi }
