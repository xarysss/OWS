# Connexion d'External Secrets à Vault via l'auth Kubernetes (jeton du ServiceAccount,
# aucun identifiant stocké). Rôle et politique créés par scripts/vault-bootstrap.sh configure.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: http://vault-active.vault.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
