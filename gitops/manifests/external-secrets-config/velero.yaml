apiVersion: v1
kind: Namespace
metadata:
  name: velero
---
# Secret au format "fichier credentials AWS" attendu par le plugin S3 de Velero.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: velero-credentials
  namespace: velero
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: velero-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        cloud: |
          [default]
          aws_access_key_id={{ .accessKey }}
          aws_secret_access_key={{ .secretKey }}
  data:
    - secretKey: accessKey
      remoteRef: { key: ows/velero, property: aws_access_key_id }
    - secretKey: secretKey
      remoteRef: { key: ows/velero, property: aws_secret_access_key }
