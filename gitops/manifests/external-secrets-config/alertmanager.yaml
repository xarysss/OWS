# Configuration Alertmanager générée depuis Vault (l'URL du webhook est un secret).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-ows
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: alertmanager-ows
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
          route:
            receiver: ows-webhook
            group_by: [alertname, namespace]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
            routes:
              - receiver: "null"
                matchers: [alertname = "Watchdog"]
          receivers:
            - name: "null"
            - name: ows-webhook
              webhook_configs:
                - url: "{{ .webhookUrl }}"
                  send_resolved: true
  data:
    - secretKey: webhookUrl
      remoteRef: { key: ows/alertmanager, property: webhook-url }
