          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 2
                  },
                  {
                    "color": "green",
                    "value": 3
                  }
                ]
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
